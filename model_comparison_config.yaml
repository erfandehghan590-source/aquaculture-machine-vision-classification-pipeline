# ==============================================================================
# پیکربندی جامع ارزیابی و بنچمارک مدل‌های بینایی ماشین (Aquaculture MV)
# ==============================================================================

root_dir: "C:/Users/conceptD/Desktop/apply resume and research/research/aquaculture MV/ours/implimentations/"
output_dir: "model_comparison_results"
enable_xai: false
gt_folder: "ground_truth"
threshold: 0.65
save_excel: true

models:
  # --------------------------------------------------------------------------
  # 1. MobileNetV3-Large (Lightweight CNN Baseline)
  # --------------------------------------------------------------------------
  - name: "MobileNetV3-Large"
    weight_class: "MobileNet_V3_Large_Weights.DEFAULT"
    log_paths: "mobilenetv3large/logs/*mobilenet*v3*large*.jsonl"
    heatmap_folder: "mobilenetv3large/gradcams"

  # --------------------------------------------------------------------------
  # 2. ResNet50 (Standard Deep Residual CNN)
  # --------------------------------------------------------------------------
  - name: "ResNet50"
    weight_class: "ResNet50_Weights.DEFAULT"
    log_paths: "resnet50/logs/*resnet50*.jsonl"
    heatmap_folder: "resnet50/gradcams"

  # --------------------------------------------------------------------------
  # 3. ResNet18 (Compact Residual CNN)
  # --------------------------------------------------------------------------
  - name: "ResNet18"
    weight_class: "ResNet18_Weights.DEFAULT"
    log_paths: "resnet18/logs/*resnet18*.jsonl"
    heatmap_folder: "resnet18/gradcams"

  # --------------------------------------------------------------------------
  # 4. ViT-B16 (Vision Transformer Baseline)
  # --------------------------------------------------------------------------
  - name: "ViT-B16"
    weight_class: "ViT_B_16_Weights.DEFAULT"
    log_paths: "ViTB16/logs/*vit*.jsonl"
    heatmap_folder: "ViTB16/gradcams"

  # --------------------------------------------------------------------------
  # 5. Swin-Tiny (Hierarchical Vision Transformer)
  # --------------------------------------------------------------------------
  - name: "Swin-Tiny"
    weight_class: "Swin_T_Weights.DEFAULT"
    log_paths: "swintiny/logs/*swin*tiny*.jsonl"
    heatmap_folder: "swintiny/gradcams"

  # --------------------------------------------------------------------------
  # 6. ConvNeXt-Tiny (Modernized Pure-CNN)
  # --------------------------------------------------------------------------
  - name: "ConvNeXt-Tiny"
    weight_class: "ConvNeXt_Tiny_Weights.DEFAULT"
    log_paths: "convnexttiny/logs/*convnext*tiny*.jsonl"
    heatmap_folder: "convnexttiny/gradcams"

  # --------------------------------------------------------------------------
  # 7. EfficientNetB0 (High-Efficiency Scaling CNN)
  # --------------------------------------------------------------------------
  - name: "EfficientNetB0"
    weight_class: "EfficientNet_B0_Weights.DEFAULT"
    log_paths: "efficientnetb0/logs/*efficientnet*B0*.jsonl"
    heatmap_folder: "efficientnetb0/gradcams"

  # --------------------------------------------------------------------------
  # 8. DenseNet121 (Dense Connectivity CNN)
  # --------------------------------------------------------------------------
  - name: "DenseNet121"
    weight_class: "DenseNet121_Weights.DEFAULT"
    log_paths: "densenet121/logs/*densenet121*.jsonl"
    heatmap_folder: "densenet121/gradcams"

  # --------------------------------------------------------------------------
  # 9. YOLOv8 Classification (Real-Time Anchor-Free Framework)
  # --------------------------------------------------------------------------
  - name: "YOLOv8"
    weight_class: null
    log_paths: "YOLOv8/logs/*yolo*cls*.jsonl"
    heatmap_folder: "YOLOv8/gradcams"
